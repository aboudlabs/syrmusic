<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SyrMusic</title>
<meta name="description" content="SyrMusic — موسيقى مجانية ومرخّصة">
<meta name="theme-color" content="#0B0A12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SyrMusic">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 5v14M9 5v14M14.5 6.5L20 19"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="f" d="M7 4.5v15l13-7.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path class="f" d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path class="f" d="M5 5v14l10-7zM17 5h2v14h-2z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path class="f" d="M19 5v14L9 12zM5 5h2v14H5z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c6 0 6 12 12 12h3M3 18h3c1.6 0 2.8-.9 3.8-2.3M14.2 8.3C15.2 6.9 16.4 6 18 6h3M18 3l3 3-3 3M18 15l3 3-3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5S4 15.6 4 9.8A4.3 4.3 0 0 1 12 7.5a4.3 4.3 0 0 1 8 2.3c0 5.8-8 10.7-8 10.7z"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h7M16 15v6l5-3z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle class="f" cx="5" cy="12" r="1.6"/><circle class="f" cx="12" cy="12" r="1.6"/><circle class="f" cx="19" cy="12" r="1.6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<div id="offline" hidden>أنت غير متصل بالإنترنت — البحث والتشغيل يحتاجان اتصالاً</div>
<main id="view" tabindex="-1"></main>

<div id="mini" class="glass" hidden>
  <button class="mini-main" id="mini-open" aria-label="فتح المشغل"><img id="mini-cover" alt=""><span class="meta"><b id="mini-title"></b><small id="mini-artist"></small></span></button>
  <button class="ib" data-p="toggle" id="mini-play" aria-label="تشغيل / إيقاف"></button>
  <button class="ib" data-p="next" aria-label="التالي"><svg class="i"><use href="#i-next"/></svg></button>
  <i id="mini-bar"></i>
</div>

<nav id="nav" class="glass" aria-label="التنقل">
  <a href="#/" data-nav="home"><svg class="i"><use href="#i-home"/></svg><span>الرئيسية</span></a>
  <a href="#/search" data-nav="search"><svg class="i"><use href="#i-search"/></svg><span>بحث</span></a>
  <a href="#/library" data-nav="library"><svg class="i"><use href="#i-lib"/></svg><span>مكتبتي</span></a>
  <a href="#/settings" data-nav="settings"><svg class="i"><use href="#i-set"/></svg><span>الإعدادات</span></a>
</nav>

<section id="full" role="dialog" aria-modal="true" aria-label="المشغل">
  <header>
    <button class="ib" id="full-close" aria-label="إغلاق"><svg class="i"><use href="#i-down"/></svg></button>
    <span>قيد التشغيل</span>
    <button class="ib" id="full-qbtn" aria-label="قائمة الانتظار" aria-pressed="false"><svg class="i"><use href="#i-queue"/></svg></button>
  </header>
  <div id="full-body">
    <img id="full-cover" alt="">
    <div class="titles"><div class="meta"><b id="full-title"></b><small id="full-artist"></small></div>
      <button class="ib" data-p="like" id="full-like" aria-label="إعجاب"><svg class="i"><use href="#i-heart"/></svg></button></div>
    <input id="seek" type="range" min="0" max="1000" value="0" dir="ltr" aria-label="التقدم">
    <div class="times" dir="ltr"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    <div class="ctrls" dir="ltr">
      <button class="ib" data-p="shuffle" id="b-shuffle" aria-label="عشوائي"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="ib" data-p="prev" aria-label="السابق"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="big" data-p="toggle" id="full-play" aria-label="تشغيل / إيقاف"></button>
      <button class="ib" data-p="next" aria-label="التالي"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="ib" data-p="repeat" id="b-repeat" aria-label="تكرار"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>
    <label id="vol-wrap"><span>الصوت</span><input id="vol" type="range" min="0" max="100" aria-label="مستوى الصوت"></label>
  </div>
  <div id="full-queue" hidden></div>
</section>

<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
